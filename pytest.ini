[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --deselect tests/test_skills.py::test_no_executable_scripts
# deselect 原因：test_no_executable_scripts 是纯提示词时代的 legacy 断言（禁止仓内 .py），
# 与 P1 深度改造 V5/V6 要求（T1/T3 必须有 scripts/*.py 确定性脚本并产出 out/）冲突。
# 按 REFIT_SPEC 指示以 deselect 方式豁免，不修改 tests/ 文件本身。
filterwarnings =
    ignore::DeprecationWarning
